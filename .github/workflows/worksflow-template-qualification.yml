name: Worksflow template qualification

on:
  pull_request:
    branches:
      - react-shadcn-template
      - go-kratos-template
  push:
    branches:
      - codex/qualify-react-shadcn
      - codex/qualify-go-kratos
  workflow_dispatch:

concurrency:
  group: worksflow-template-qualification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  qualify:
    name: Validate, scan, and publish evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select isolated evidence directory
        run: echo "QUALIFICATION_OUT_DIR=$RUNNER_TEMP/worksflow-template-qualification" >> "$GITHUB_ENV"

      - name: Validate template and build evidence
        run: bash .github/scripts/qualify-template.sh validate

      - name: Publish immutable image and SPDX referrer
        if: github.event_name == 'push' && startsWith(github.ref_name, 'codex/qualify-')
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: bash .github/scripts/qualify-template.sh publish

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worksflow-template-qualification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/worksflow-template-qualification/
            !${{ runner.temp }}/worksflow-template-qualification/trivy-cache/**
            !${{ runner.temp }}/worksflow-template-qualification/toolchain-cache/**
            !${{ runner.temp }}/worksflow-template-qualification/syft-home/**
            !${{ runner.temp }}/worksflow-template-qualification/tmp/**
          if-no-files-found: error
          retention-days: 30
